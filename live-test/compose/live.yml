# Live test stack (18 Nov): the platform's real code from the current tree, real AI (Groq/Gemini through
# llm_proxy.py), real email (Stalwart relaying through Hostinger for kairoxaitech.com), monitoring to the running
# SigNoz (network kairox-platform_default) and Phoenix. Vendors without access yet (WhatsApp Meta, Telnyx, SES,
# CMS, R2) point at fake_services.py.
#   docker compose -p kxlive -f live-test/compose/live.yml up -d
# Separate project, ports and volumes: the developer's own containers are untouched.

x-env: &env
  KX_ENV: local
  KX_COMPANY_CODE: pack
  KX_LOG_JSON: "true"
  KX_PLATFORM_PLAN: free
  KX_PLATFORM__LLM_STANDBY: ${LLM_STANDBY:-gemini}
  KX_PLATFORM__EMBEDDINGS: ${EMBEDDINGS_MODEL:-qwen3}
  KX_CRM_DSN: postgresql+asyncpg://pack_crm_app:dev@postgres:5432/pack_crm
  KX_AUTOMATION_DSN: postgresql+asyncpg://pack_automation_app:dev@postgres:5432/pack_automation
  KX_AGENTS_DSN: postgresql+asyncpg://pack_agents_app:dev@postgres:5432/pack_agents
  KX_CMS_DSN: postgresql+asyncpg://pack_cms_app:dev@postgres:5432/pack_cms
  KX_DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  KX_DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  KX_REDIS_URL: redis://redis:6379/0
  KX_APP_CELERY_BROKER_URL: redis://redis:6379/8
  KX_APP_WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
  # capacity runs only: the synthetic buyers write ~4 messages a minute, above the 2-a-minute recipient cap
  KX_AUTO_RATE_LIMIT__RECIPIENT_REFILL_PER_MINUTE: ${RECIPIENT_REFILL:-2.0}
  KX_SERVICE_TOKEN_SECRET: live-test-service-token-secret-0123456789abcdef
  KX_AUTH__ENCRYPTION_KEY: "ZM0ARi02VXefvmtu5V-p8vcIb2VUBgm3w8l9przEtm8="
  KX_APP_CHROMIUM_PATH: /usr/bin/chromium
  KX_APP_FORWARDED_ALLOW_IPS: "*"
  KX_TRUSTED_CLIENT_IP_HEADER: X-Forwarded-For
  KX_APP_CORS_ORIGINS: '["http://localhost:3001"]'
  # AI: Claude path -> llm_proxy (Groq -> Gemini); the platform's own standby = Gemini 3.8 Flash (real key)
  ANTHROPIC_BASE_URL: http://llmproxy:9100
  KX_APP_ANTHROPIC_API_KEY: sk-ant-live-test-proxy
  KX_APP_GEMINI_API_KEY: ${GEMINI_API_KEY}
  KX_APP_SPEND_AI_USD_PER_DAY: "100000"
  # WORKAROUND for defect D-1 (models.py _GEMINI_THINKING medium -> "medium" rejected by langchain-google-genai 3.2):
  KX_APP_LLM_EFFORT_SMART: ${LLM_EFFORT_SMART:-}  # empty = the code default (D-1 fixed 18 Nov)
  # monitoring
  KX_APP_OTLP_ENDPOINT: http://host.docker.internal:4318   # SigNoz collector published port (NOT its network: names clash with the dev stack)
  KX_APP_AI_TRACE_ENDPOINT: http://phoenix:6006/v1/traces
  KX_APP_PHOENIX_PROJECT: pack
  # email: Stalwart (real), From = the Hostinger mailbox
  KX_AUTO_STALWART__URL: http://stalwart:8080
  KX_AUTO_STALWART__USERNAME: ${STALWART_USER:-hamthan}
  KX_AUTO_STALWART__PASSWORD: ${KX_MAIL_PASSWORD}
  KX_AUTO_SES__FROM_ADDRESS: Hamthan@kairoxaitech.com
  AWS_ENDPOINT_URL: http://fakes:9000
  AWS_ACCESS_KEY_ID: live
  AWS_SECRET_ACCESS_KEY: live
  AWS_REGION: me-central-1
  # storage (R2) -> fake S3
  KX_STORAGE__ENDPOINT_URL: http://fakes:9000
  KX_STORAGE__ACCESS_KEY_ID: live
  KX_STORAGE__SECRET_ACCESS_KEY: live
  KX_STORAGE__BUCKET: kx-live
  # WhatsApp / Telnyx / CMS -> fakes (no access yet)
  KX_AUTO_WHATSAPP__GRAPH_BASE_URL: http://fakes:9000
  KX_AUTO_WHATSAPP__PHONE_NUMBER_ID: "100000000000001"
  KX_AUTO_WHATSAPP__ACCESS_TOKEN: live-wa-token
  KX_AUTO_WHATSAPP__APP_SECRET: live-wa-secret
  KX_AUTO_WHATSAPP__VERIFY_TOKEN: live-wa-verify
  KX_AUTO_TELNYX__API_BASE_URL: http://fakes:9000
  KX_AUTO_TELNYX__API_KEY: live-telnyx
  KX_AUTO_TELNYX__FROM_NUMBER: "+971400000000"
  KX_AUTO_TELNYX__CALLBACK_SECRET: live-telnyx-callback-secret
  KX_AUTO_PUBLIC_BASE_URL: http://api:8000
  KX_AUTO_COMPANY_NAME: Arifa Packing & Packaging LLC
  KX_APP_CMS_URL: http://fakes:9000
  KX_APP_CMS_API_KEY: live-cms-key
  KX_APP_CMS_WEBHOOK_SECRET: live-cms-secret

x-app: &app
  image: kxlive/app:local
  read_only: true
  tmpfs: [/tmp]
  restart: "no"
  labels: { kx.logs: otlp }
  # app containers stay on their own network only

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KX_DEV_DB_PASSWORD: dev
      KX_INIT_APPLY_DDL: "1"
      KX_COMPANY_PREFIX: pack_
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    ports: ["35432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../db/ddl:/kx/ddl:ro
      - ../../infra/server/postgres/db_bootstrap.sh:/kx/db_bootstrap.sh:ro
      - ../../docker/postgres/initdb.sh:/docker-entrypoint-initdb.d/10-kairox.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pack_agents"]
      interval: 5s
      timeout: 3s
      retries: 40

  redis:
    image: redis:8.2
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports: ["36379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  fakes:
    image: kxlive/app:local
    entrypoint: ["python", "/bench/fake_services.py"]
    environment:
      FAKE_DATA_DIR: /data
      FAKE_LLM_DELAY_S: ${FAKE_LLM_DELAY_S:-3.0}
    volumes:
      - ../../resource-usage-bench/scripts:/bench:ro
      - fakedata:/data
    user: "0:0"
    ports: ["39000:9000"]

  llmproxy:
    image: kxlive/app:local
    entrypoint: ["python", "/live/llm_proxy.py"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PROXY_MODE: ${PROXY_MODE:-real}
    volumes:
      - ../scripts:/live:ro
    ports: ["39100:9100"]

  stalwart:
    image: stalwartlabs/stalwart:v1.1.1
    init: true
    environment:
      STALWART_RECOVERY_ADMIN: admin:live-test-admin
    ports: ["38090:8080", "32525:25"]
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

  phoenix:
    image: arizephoenix/phoenix:version-12.9.0
    ports: ["36006:6006"]

  migrate:
    <<: *app
    command: ["migrate"]
    environment: { <<: *env, KX_PROCESS: migrate }
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *app
    command: ["api"]
    environment: { <<: *env, KX_PROCESS: api }
    ports: ["38000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["worker", "--queues", "kx"]
    environment: { <<: *env, KX_PROCESS: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker-ai:  # D-6: AI turns on their own queue, threads pool
    <<: *app
    command: ["worker", "--queues", "kx.ai", "--pool", "threads"]
    environment: { <<: *env, KX_PROCESS: worker, KX_APP_WORKER_CONCURRENCY: "${AI_WORKER_THREADS:-10}" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *app
    command: ["beat"]
    environment: { <<: *env, KX_PROCESS: beat }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  fakedata:
  stalwart-etc:
  stalwart-data:

