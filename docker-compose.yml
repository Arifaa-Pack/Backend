# Local development stack (16 Nov v2; docs/LOCAL_DEV.md). One profile at a time on a small laptop.
#   docker compose up -d postgres redis                 # make up: databases only (run the app with `uv run kx …`)
#   docker compose up --build -d                        # make up-all: + migrate, api, worker, beat
#   docker compose --profile voice up -d                # make up-voice: LiveKit (dev) + free speech server + voice
#   docker compose --profile mail up -d stalwart        # make up-mail
#   docker compose --profile obs up -d                  # make up-obs: Phoenix (AI audit trail)
#   docker compose --profile embed up -d embeddings     # make up-embed: TEI (Qwen3 by default: smaller than BGE-M3)
#   docker compose --profile pgbouncer up -d pgbouncer  # run the tests through PgBouncer (port 6432)
#
# Postgres init (first start of the volume): the same db_bootstrap.sh as the server (prefix pack_), then db/ddl
# applied as each owning role. Models are cached on D: (KX_MODELS_DIR). Reset: docker compose down -v
#
# M12 (live-test infra review 18 Nov): every port is published on 127.0.0.1 only. Docker Desktop otherwise
# listens on every interface, so anyone on the same Wi-Fi reached Postgres (postgres/postgres), Redis (no
# password), the Stalwart admin and LiveKit's dev keys. The credentials here are local defaults only; to reach
# the stack from another device on purpose (a phone on the LAN), set KX_DEV_BIND=0.0.0.0 for that session.
# M4: memory ceilings: the default stack (postgres, redis, migrate, api, worker, beat) stays under ≈ 5 GB, and
# under ≈ 6 GB with the mail, obs or pgbouncer profile added. voice (≈ 5.5 GB: speech models + LiveKit + worker)
# and embed (4 GB: the model) are sized for their models: run them with `make up` only, not with up-all.

x-kx-env: &kx-env
  KX_ENV: local
  KX_COMPANY_CODE: pack
  KX_LOG_JSON: "false"
  KX_PLATFORM_PLAN: free
  KX_CRM_DSN: postgresql+asyncpg://pack_crm_app:dev@postgres:5432/pack_crm
  KX_AUTOMATION_DSN: postgresql+asyncpg://pack_automation_app:dev@postgres:5432/pack_automation
  KX_AGENTS_DSN: postgresql+asyncpg://pack_agents_app:dev@postgres:5432/pack_agents
  KX_CMS_DSN: postgresql+asyncpg://pack_cms_app:dev@postgres:5432/pack_cms
  KX_REDIS_URL: redis://redis:6379/0
  KX_APP_CELERY_BROKER_URL: redis://redis:6379/8
  KX_APP_WORKER_CONCURRENCY: "2"
  KX_APP_EMBEDDING_URL: http://embeddings:80
  KX_APP_SPEECH_URL: http://speech:8100
  KX_APP_AI_TRACE_ENDPOINT: http://phoenix:6006/v1/traces
  KX_AUTO_STALWART__URL: http://stalwart:8080
  KX_API_PORT: "8000"
  KX_APP_CHROMIUM_PATH: /usr/bin/chromium

x-kx-app: &kx-app
  build:
    context: .
    dockerfile: Dockerfile
  image: kairox/app:local
  env_file:
    - path: .env
      required: false
  read_only: true
  tmpfs:
    - /tmp
  labels: { kx.logs: otlp }  # SigNoz collector skips these log files: the app sends logs over OTLP
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "3", labels: "kx.logs,com.docker.compose.service,com.docker.compose.project" }

x-logs: &logs
  driver: json-file
  options: { max-size: "50m", max-file: "3", labels: "com.docker.compose.service,com.docker.compose.project" }

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm   # = the server image's base
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KX_DEV_DB_PASSWORD: dev
      KX_INIT_APPLY_DDL: "1"
      KX_COMPANY_PREFIX: pack_
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/ddl:/kx/ddl:ro
      - ./infra/server/postgres/db_bootstrap.sh:/kx/db_bootstrap.sh:ro
      - ./docker/postgres/initdb.sh:/docker-entrypoint-initdb.d/10-kairox.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pack_agents"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logs

  pgbouncer:
    profiles: ["pgbouncer"]
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_DB_CONNECTIONS: "40"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path,statement_timeout
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 128m }

  redis:
    image: redis:8.2.3   # ≥ 8.2.2: CVE-2025-49844, as on the server
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 256m }

  embeddings:
    profiles: ["embed"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    # Qwen3 (≈ 3.1 GB RAM) fits a small laptop; BGE-M3 (≈ 4.8 GB) is the server default. Set KX_PLATFORM__EMBEDDINGS
    # to match the model you run here, or search keeps to full-text.
    command: ["--model-id", "${LOCAL_EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}", "--port", "80",
              "--auto-truncate", "--max-batch-tokens", "1024"]
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:8080:80"
    volumes:
      - ${KX_MODELS_DIR:-D:/kx-models}/tei:/data
    deploy:
      resources:
        limits: { memory: 4g }

  speech:
    profiles: ["voice"]
    build:
      context: services/speech
    image: kairox/speech:local
    environment:
      STT_THREADS: "4"
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:8100:8100"
    volumes:
      - ${KX_MODELS_DIR:-D:/kx-models}/speech:/models
    deploy:
      resources:
        limits: { memory: 3g }

  livekit:
    profiles: ["voice"]
    image: livekit/livekit-server:v1.13.11
    command: ["--dev", "--bind", "0.0.0.0"]  # dev keys: devkey / secret
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:7880:7880"
      - "${KX_DEV_BIND:-127.0.0.1}:7881:7881"
      - "${KX_DEV_BIND:-127.0.0.1}:7882:7882/udp"   # --dev mode: one UDP media port (rtc.udp_port 7882), not the server's range
      - "${KX_DEV_BIND:-127.0.0.1}:50000-50020:50000-50020/udp"
    deploy:
      resources:
        limits: { memory: 512m }

  stalwart:
    profiles: ["mail"]
    image: stalwartlabs/stalwart:v1.1.1
    init: true
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:2525:25"
      - "${KX_DEV_BIND:-127.0.0.1}:8090:8080"   # web admin + JMAP: finish the setup wizard once, create the sales@ account
    environment:
      STALWART_RECOVERY_ADMIN: admin:local-dev-only   # local only; known admin password for the wizard
      SES_SMTP_PASSWORD: ${KX_SES_SMTP_PASSWORD:-unused-locally}
    volumes:
      # v1 volumes are new on purpose: v1 cannot read the v0.14 `stalwart` volume (no in-place upgrade)
      - stalwart-v1-etc:/etc/stalwart    # config.json
      - stalwart-v1:/var/lib/stalwart    # RocksDB (mail, accounts, settings, DKIM keys)
    deploy:
      resources:
        limits: { memory: 512m }

  phoenix:
    profiles: ["obs"]
    image: arizephoenix/phoenix:version-12.9.0
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:6006:6006"
    deploy:
      resources:
        limits: { memory: 1g }

  migrate:
    <<: *kx-app
    command: ["migrate"]
    environment:
      <<: *kx-env
      KX_PROCESS: migrate
    restart: "no"
    deploy:
      resources:
        limits: { memory: 768m }
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *kx-app
    command: ["api"]
    environment:
      <<: *kx-env
      KX_PROCESS: api
      KX_APP_FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${KX_DEV_BIND:-127.0.0.1}:8000:8000"
    deploy:
      resources:
        limits: { memory: 1g }
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *kx-app
    command: ["worker"]
    environment:
      <<: *kx-env
      KX_PROCESS: worker
    deploy:
      resources:
        limits: { memory: 1536m }
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Exactly one Celery Beat: never scale this service.
  beat:
    <<: *kx-app
    command: ["beat"]
    environment:
      <<: *kx-env
      KX_PROCESS: beat
    deploy:
      resources:
        limits: { memory: 384m }
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  voice:
    <<: *kx-app
    profiles: ["voice"]
    command: ["voice"]
    environment:
      <<: *kx-env
      KX_PROCESS: voice
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      KX_APP_LIVEKIT_URL: ws://livekit:7880
      KX_APP_LIVEKIT_API_KEY: devkey
      KX_APP_LIVEKIT_API_SECRET: secret
      KX_APP_VOICE_IDLE_PROCESSES: "1"
    deploy:
      resources:
        limits: { memory: 2g }
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  stalwart-v1:
  stalwart-v1-etc:
