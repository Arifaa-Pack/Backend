# M3 / M16 (live-test infra review 18 Nov): keep pinned things moving. Actions are pinned by commit SHA and the
# base images by digest, so nothing changes under us; Dependabot opens a PR when a new version or digest exists,
# and CI (plus .github/workflows/image-scan.yml) checks it before anyone merges.
# Third-party images of the server stacks are `${KX_IMG_*:-image:tag}` defaults in infra/server/stacks/*.yml;
# the docker-compose ecosystem below may not read a tag inside `${...:-...}` (verify on the first run): if it
# proposes nothing for them, bump those by hand after each image's release notes (infra/server/README.md §8).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/, /services/speech, /infra/server/postgres]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directories: [/, /infra/server/stacks]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/speech
    schedule: { interval: weekly, day: monday }
