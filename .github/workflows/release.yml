name: release

# Tag v* -> build the amd64 app and speech images -> push to GitHub Container Registry -> ask Coolify to redeploy
# the staging app stack; production is redeployed by hand in Coolify (or a manual run with target=production).
# Coolify then runs `migrate` first and rolls api / worker / voice (Beat stop-then-start). D49.
#
# Repository secrets: COOLIFY_TOKEN; variables: COOLIFY_URL, COOLIFY_STAGING_UUID, COOLIFY_PRODUCTION_UUID.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Coolify environment to redeploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # D12c (architecture guide): a tag or a manual run deploys only after the full CI (lint, types, tests on
  # PostgreSQL, image build, server-stack checks) has passed on this exact commit.
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then tag="${GITHUB_REF_NAME}"; else tag="sha-${GITHUB_SHA::12}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: app image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/app:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: speech image
        uses: docker/build-push-action@v7
        with:
          context: services/speech
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/speech:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=speech
          cache-to: type=gha,scope=speech,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target || 'staging' }}
    steps:
      - name: Coolify redeploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ (inputs.target || 'staging') == 'production' && vars.COOLIFY_PRODUCTION_UUID || vars.COOLIFY_STAGING_UUID }}
        run: |
          curl -fsS -X GET "${COOLIFY_URL}/api/v1/deploy?uuid=${UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
