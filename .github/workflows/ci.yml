name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  python:
    name: python (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KX_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6

      # setup-uv v8 publishes immutable releases only: pin the full version.
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.14 and the workspace
        run: |
          uv python install 3.14
          uv sync --frozen

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy packages/*/src apps/*/src

      - name: import boundaries
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest

  image:
    name: docker build (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build the app image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: kairox/app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Smoke test the app image
        run: |
          docker run --rm --entrypoint python kairox/app:ci -c "import kx.core, kx.crm, kx.automation, kx.agents, arifaa_pack, weasyprint; from livekit.plugins import deepgram, elevenlabs, openai, silero; print('ok')"
          docker run --rm --entrypoint fc-list kairox/app:ci :lang=ar family | head -3
          docker run --rm --entrypoint psql kairox/app:ci --version
          docker run --rm --entrypoint chromium kairox/app:ci --version
          docker run --rm -e KX_PLATFORM_PLAN=free kairox/app:ci platform show

      - name: Build the speech image (no push)
        uses: docker/build-push-action@v7
        with:
          context: services/speech
          platforms: linux/amd64
          push: false
          tags: kairox/speech:ci
          cache-from: type=gha,scope=speech
          cache-to: type=gha,scope=speech,mode=max

  stacks:
    name: server stacks (compose config, shellcheck, hadolint, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: docker compose config (every stack, dummy env)
        run: |
          set -e
          cd infra/server/stacks
          cp env/pack.env.example env/pack.env
          export POSTGRES_PASSWORD=x R2_BUCKET=x R2_ENDPOINT_URL=https://x R2_ACCESS_KEY_ID=x R2_SECRET_ACCESS_KEY=x                  LIVEKIT_NODE_IP=203.0.113.1 LIVEKIT_API_KEY=x LIVEKIT_API_SECRET=x PHOENIX_DB_PASSWORD=x                  CROWDSEC_CF_BOUNCER_KEY=x CROWDSEC_FW_BOUNCER_KEY=x CLOUDFLARE_API_TOKEN=x PUBLIC_API_URL=https://x
          for f in compose.*.yml; do echo "== $f"; docker compose -f "$f" config -q; done
          cd ../../..
          docker compose -f docker-compose.yml config -q

      - name: shellcheck
        run: shellcheck infra/server/postgres/db_bootstrap.sh infra/server/backup/volumes-to-r2.sh docker/postgres/initdb.sh

      - uses: astral-sh/setup-uv@v8.1.0

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: hadolint
        run: |
          uvx --from hadolint-bin==2.15.1 hadolint Dockerfile
          uvx --from hadolint-bin==2.15.1 hadolint services/speech/Dockerfile infra/server/postgres/Dockerfile
