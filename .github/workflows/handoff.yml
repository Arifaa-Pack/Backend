name: handoff

# D60: docs/handoff/ (API docs, OpenAPI, Postman collections, endpoints.json) is generated from the code by
# `make handoff`. This fails when the committed files no longer match the code; refresh them with `make handoff`.
# (The two Word guides need node + the docx package and are rebuilt by hand; see docs/handoff/README.md.)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: handoff-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  handoff:
    name: docs/handoff is current
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.14 and the workspace
        run: |
          uv python install 3.14
          uv sync --frozen --all-packages

      - name: make handoff, then no difference
        run: |
          uv run python scripts/gen_handoff.py
          git diff --exit-code -- docs/handoff
