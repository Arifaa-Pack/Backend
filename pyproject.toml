[[tool.importlinter.contracts]]
name = "CRM rule 4: inside each slice the routers sit above the service code"
type = "layers"
containers = [
    "kx.crm.admin",
    "kx.crm.assignment",
    "kx.crm.auth",
    "kx.crm.catalogue",
    "kx.crm.change_requests",
    "kx.crm.company",
    "kx.crm.deals",
    "kx.crm.operations",
    "kx.crm.quotes",
    "kx.crm.records",
    "kx.crm.reports",
    "kx.crm.screens",
    "kx.crm.texts",
]
layers = [
    "(router) : (actions_router) : (users_router)",
    "(service) : (issuing) : (grants) : (pdf) : (workbook) : (dashboards) : (scheduled) : (summary) : (lost_proposals) : (session_guard) : (throttle) : (consent) : (phone) : (fx) : (proposals) : (price_list_service)",
]

