name = "CRM: the pricing maths stays pure (no database, no ORM, no I/O)"
type = "forbidden"
source_modules = ["kx.crm.pricing.engine", "kx.crm.pricing.price_list", "kx.crm.pricing.types"]
forbidden_modules = ["sqlalchemy", "kx.core.db", "kx.crm.models", "kx.crm._shared", "httpx", "redis"]

