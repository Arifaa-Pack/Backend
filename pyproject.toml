allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "rule 3: the app imports no ORM or query module (only the packages' public code)"
type = "forbidden"
source_modules = ["arifaa_pack"]
forbidden_modules = ["kx.crm.models", "kx.automation.models", "kx.automation.repo", "kx.agents.orm"]
