[project]
name = "arifaa-pack"
version = "0.1.0"
description = "Arifaa Pack client app: company config, prompts, plugins, entrypoints (api, worker, voice)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "kx-core-db",
    "kx-core-crm",
    "kx-core-automation",
    "kx-agent-framework[voice]",
    "uvicorn[standard]==0.54.0",
    "alembic==1.20.1",
    "pyyaml==6.0.3",
    "celery[redis]==5.7.0",
    # D52 voice plug-ins (16 Nov, approved with the v2 plan): paid engines + the OpenAI-compatible client that
    # reaches our free speech server, and Silero VAD (end of turn = VAD; the turn-detector plug-in is
    # deprecated and its replacement calls LiveKit Cloud)
    "livekit-plugins-deepgram==1.8.10",
    "livekit-plugins-elevenlabs==1.8.10",
    "livekit-plugins-openai==1.8.10",
    "livekit-plugins-silero==1.8.10",
    # D46 telemetry: SDK + OTLP exporter (kx.core uses only the API)
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    # 17 Nov (approved by Hamthan): HTTP spans for the API and job spans for the Celery worker, to SigNoz
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-celery==0.66b2",
]

[project.scripts]
kx = "arifaa_pack.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arifaa_pack"]
