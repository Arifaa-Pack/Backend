# OS user -> database role for local-socket (peer) logins (pg_hba.conf). `root` is whoever runs
# `docker compose exec postgres ...` (db_bootstrap.sh, wal-g backup-push from the Coolify scheduled task); anyone
# who can do that is already root on the host.
# MAPNAME    SYSTEM-USERNAME  PG-USERNAME
superuser    postgres         postgres
superuser    root             postgres
