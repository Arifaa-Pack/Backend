# PostgreSQL 18 on the 64 GB dedicated server (D48, docs/DATABASE.md). The app reaches it through PgBouncer.
listen_addresses = '*'                # the container's networks only; who may log in: pg_hba.conf (H1)
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'
max_connections = 200                 # bench: 106 at the old pool defaults; PgBouncer caps each DB at 40
superuser_reserved_connections = 5

# memory (Postgres shares the box with TEI, speech, LiveKit, SigNoz: ≈ 25-29 GB used at peak, v2 §5)
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 16MB
maintenance_work_mem = 512MB          # HNSW index builds (pgvector)
wal_buffers = 64MB

# disks: 2 x SSD RAID 1
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL + continuous archiving to R2 (WAL-G; env WALG_S3_PREFIX, AWS_ENDPOINT, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# WALG_LIBSODIUM_KEY: every segment is encrypted before upload)
wal_level = replica
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 300
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# autovacuum keeps up with the nightly pruning (per-table settings in the retention migrations)
autovacuum_max_workers = 4
autovacuum_naptime = 30s

# observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = 1s

password_encryption = scram-sha-256
timezone = 'UTC'
