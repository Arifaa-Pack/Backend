# Who may log in, and from where (H1, D48). Replaces the image default (`host all all all scram-sha-256`), which
# let the `postgres` superuser in over TCP from every container on the network.
#   * superuser: only over the local socket inside the container (docker compose exec postgres ...), as the OS user
#     postgres or root (pg_ident.conf map `superuser`). Over TCP: always refused.
#   * app roles (pack_*_app, pack_reporting_ro): password (SCRAM) over TCP from the kx-data network only, i.e.
#     PgBouncer, `migrate` and the CMS. The subnet is the one kx-data was created with (infra/server/README.md §2):
#     change both together.
# Which database each role may open is limited by db_bootstrap.sh (REVOKE CONNECT FROM PUBLIC).
# TYPE  DATABASE  USER      ADDRESS          METHOD
local   all       postgres                   peer map=superuser
local   all       all                        reject
host    all       postgres  0.0.0.0/0        reject
host    all       postgres  ::/0             reject
host    all       all       10.201.0.0/24    scram-sha-256
host    all       all       0.0.0.0/0        reject
host    all       all       ::/0             reject
