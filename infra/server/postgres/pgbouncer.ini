; PgBouncer in transaction mode in front of PostgreSQL (D48). The app sets KX_DB_PGBOUNCER=true (no
; server-side prepared-statement caches; search_path / statement_timeout come from ALTER ROLE ... SET).
; Migrations (kx migrate) and db_bootstrap.sh connect to postgres:5432 directly, never through here.
; Comments must be on their own line: PgBouncer does not strip end-of-line comments.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
auth_type = scram-sha-256
; one line per app role: "pack_crm_app" "SCRAM-SHA-256$..." (runbooks/rotate-secrets.md)
auth_file = /etc/pgbouncer/userlist.txt
default_pool_size = 20
; per database: 3 app DBs x 40 + CMS stays under max_connections 200
max_db_connections = 40
min_pool_size = 2
reserve_pool_size = 5
max_client_conn = 1000
server_idle_timeout = 300
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,search_path,statement_timeout
admin_users = postgres
stats_users = postgres
