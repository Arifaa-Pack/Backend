# Email (D44): Stalwart mail server v1.1.1 (pinned; tested locally 17 Nov with the app's JMAP code and a relay
# that requires STARTTLS + SMTP AUTH like SES). MX on :25 (public); JMAP / admin on :8080, never published: the app
# reaches it on kx-mail (external, created with --internal: Stalwart + the app only, H1), admins through a tunnel.
# `default` (this stack's own network) carries :25 and the relay out to SES.
#
# First start (bootstrap mode): open the web admin through the tunnel (ssh -L 8080:<stalwart ip>:8080, the
# container's address on this stack's default network: docker inspect <container>) and log in
# as admin / KX_STALWART_RECOVERY_ADMIN's password, then finish the wizard: hostname mail.<domain>, domain
# <domain>, DKIM keys on (RSA + Ed25519 are both created), logging = Console, DNS = manual (copy the records into
# Cloudflare). Then, in Settings (or over JMAP, infra/server/README.md §4):
#   * Account: sales@<domain>, role User  -> KX_AUTO_STALWART__USERNAME / __PASSWORD in env/pack.env
#   * MTA > Outbound > Routes: Relay "ses", host email-smtp.<region>.amazonaws.com, port 587, implicitTls off
#     (STARTTLS), authUsername = SES SMTP user, authSecret = EnvironmentVariable SES_SMTP_PASSWORD
#   * MTA > Outbound > Strategy > route: if is_local_domain(rcpt_domain) then 'local' else 'ses'
#   * Raise the default throttle (25 messages an hour per sender + recipient) before go-live (OPEN_QUESTIONS #71)
# The app deletes finished JMAP submission records itself (v1 refuses sends after 500 of them, maxSubmissions).
# v0.x data cannot be upgraded in place (stalwart-migrate); this is a new install, so start v1 on empty volumes.
#
# Mail-only secrets (M13): KX_STALWART_RECOVERY_ADMIN and KX_SES_SMTP_PASSWORD are Coolify variables of THIS
# resource (kx-mail) only, marked encrypted; never in the app's env file (env/pack.env), which every app container
# loads. Recovery admin: `admin:<openssl rand -hex 24>`, for the first setup only; delete the variable and redeploy
# straight after the wizard, then check `docker inspect <stalwart> --format '{{.Config.Env}}'` shows
# STALWART_RECOVERY_ADMIN= (empty) (docs/GO_LIVE_CHECKLIST.md C5).
name: kx-mail

services:
  stalwart:
    image: ${KX_IMG_STALWART:-stalwartlabs/stalwart:v1.1.1}
    init: true
    restart: unless-stopped
    ports:
      - "25:25"
    environment:
      STALWART_RECOVERY_ADMIN: ${KX_STALWART_RECOVERY_ADMIN:-}   # admin:<password> for the first setup only
      SES_SMTP_PASSWORD: ${KX_SES_SMTP_PASSWORD:?SES SMTP password (from the SES SMTP credentials)}
    volumes:
      # v1: config.json (written by the wizard) in /etc/stalwart; RocksDB (mail, accounts, settings, DKIM keys)
      # in /var/lib/stalwart. Both are backed up nightly (backup/volumes-to-r2.sh).
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    networks: [default, kx-mail]
    # M15: runs as uid 2000; the binary carries the file capability cap_net_bind_service (port 25), so that one
    # stays in the bounding set. Tested 18 Nov with v1.1.1 (bootstrap mode starts, listeners up).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # M14: the nightly backup stops this container for the copy (RocksDB is not copied while it writes)
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2" }   # M4
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3", labels: "com.docker.compose.service,com.docker.compose.project" }

volumes:
  stalwart-etc:
  stalwart-data:

networks:
  default:
  kx-mail:
    external: true
