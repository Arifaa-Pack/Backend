# LiveKit server (self-hosted, Apache-2.0). Keys come from LIVEKIT_KEYS (compose env), never from this file.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false   # --node-ip is passed explicitly
turn:
  enabled: true
  udp_port: 3478   # UDP TURN for callers behind strict NAT (TLS TURN would need a domain + certificate)
room:
  empty_timeout: 60
  max_participants: 4      # visitor + agent (+ a listening salesperson later)
logging:
  level: info
  json: true
