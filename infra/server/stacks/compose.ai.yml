# AI services on our server: knowledge-search embeddings (D47) and the free speech server (D52). Private only:
# neither has authentication, so they sit on kx-ai (external, created with --internal, infra/server/README.md §2),
# which only the app joins. `default` (this stack's own network) is for the model downloads on first start.
name: kx-ai

services:
  embeddings:
    # TEI CPU image (amd64): cpu-1.8, not 1.7.2 (crashes with Qwen3 on CPU, bench R4)
    image: ${KX_IMG_TEI:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.8}
    restart: unless-stopped
    # KX_PLATFORM__EMBEDDINGS=bge-m3 -> BAAI/bge-m3 ; qwen3 -> Qwen/Qwen3-Embedding-0.6B (then `kx reindex`)
    command: ["--model-id", "${EMBEDDING_MODEL_ID:-BAAI/bge-m3}", "--port", "80", "--auto-truncate",
              "--max-batch-tokens", "1024"]
    volumes:
      - tei-cache:/data
    networks: [default, kx-ai]
    # M15: no capabilities (tested 18 Nov with cpu-1.8: model download into /data, server ready)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # M4: half the cores, so a re-index (all cores for ≈ 30 min per 2,500 chunks) leaves the rest to the app
    deploy:
      resources:
        limits: { memory: 6g, cpus: "6" }
    logging: &logs
      driver: json-file
      options: { max-size: "50m", max-file: "3", labels: "com.docker.compose.service,com.docker.compose.project" }

  speech:
    build:
      context: ../../../services/speech
    image: kairox/speech:${KX_SPEECH_TAG:-latest}
    restart: unless-stopped
    environment:
      STT_MODEL: small
      STT_COMPUTE: int8
      STT_THREADS: "4"
      PIPER_VOICES: en,ar,hi,zh
    volumes:
      - speech-models:/models
    networks: [default, kx-ai]
    # M15: runs as the `speech` user (uid 10002), needs no capabilities
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 4g, cpus: "4" }   # STT_THREADS=4
    logging: *logs

volumes:
  tei-cache:
  speech-models:

networks:
  default:
  kx-ai:
    external: true
