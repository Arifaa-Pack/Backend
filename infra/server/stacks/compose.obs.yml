# Telemetry tier (D46, D48): the AI audit trail (Arize Phoenix) on its own Postgres. SigNoz is installed from its
# official Docker compose at a pinned release; its collector joins the `kx-obs` network (infra/server/README.md §5)
# and is then reachable as http://signoz-otel-collector:4318 (KX_APP_OTLP_ENDPOINT).
# Networks (H1): phoenix-postgres is on this stack's own internal network (Phoenix only); Phoenix is on kx-obs for
# the app's traces. Phoenix requires a login (H1): the app sends a Phoenix system API key (KX_APP_AI_TRACE_HEADERS).
name: kx-obs

services:
  phoenix-postgres:
    # M16: the same pinned release as the data tier (pg18 was 0.8.7-pg18-bookworm on 18 Nov)
    image: ${KX_IMG_PG:-pgvector/pgvector:0.8.7-pg18-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: ${PHOENIX_DB_PASSWORD:?}
      POSTGRES_DB: phoenix
    volumes:
      # Postgres 18 images: one mount at /var/lib/postgresql (a mount at .../data makes the container refuse to
      # start, found on the local stack 16 Nov)
      - phoenix-pg:/var/lib/postgresql
    networks: [phoenix-db]
    # M15: the entrypoint chowns the data directory, then drops to `postgres` (gosu)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1" }   # M4
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix"]
      interval: 10s
      retries: 30
    logging: &logs
      driver: json-file
      options: { max-size: "50m", max-file: "3", labels: "com.docker.compose.service,com.docker.compose.project" }

  phoenix:
    image: ${KX_IMG_PHOENIX:-arizephoenix/phoenix:version-21.1.0}
    restart: unless-stopped
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:${PHOENIX_DB_PASSWORD}@phoenix-postgres:5432/phoenix
      PHOENIX_PORT: "6006"
      # 30-90 days (D48); traces are re-creatable, never backed up
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "${PHOENIX_RETENTION_DAYS:-60}"
      # login for the UI and an API key for trace ingest (H1: traces may hold buyer PII)
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:?32+ random characters (openssl rand -hex 32)}
    depends_on:
      phoenix-postgres:
        condition: service_healthy
    # UI on the host's loopback only: ssh -L 6006:127.0.0.1:6006 <server> (H2)
    ports:
      - "127.0.0.1:6006:6006"
    networks: [default, phoenix-db, kx-obs]
    # M15: no capabilities (tested 18 Nov with version-12.9.0, auth on)
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2" }   # M4
    logging: *logs

volumes:
  phoenix-pg:

networks:
  default:          # publishes the loopback UI port
  phoenix-db:
    internal: true  # phoenix-postgres: Phoenix only
  kx-obs:
    external: true
