# One project's app stack (company `pack` today; docs/MULTI_PROJECT.md for more later).
# Coolify: Docker Compose resource with the env file of env/pack.env.example filled in (secrets encrypted).
# Order: migrate (one-off, exits 0) -> api, worker, beat, voice. Beat is exactly one: never scale it.
name: kx-pack

x-app: &app
  image: ${KX_APP_IMAGE:-ghcr.io/kairox/app:latest}
  restart: unless-stopped
  env_file: ["${KX_ENV_FILE:-env/pack.env}"]  # quoted: a bare { inside [ ] is YAML flow-mapping syntax
  read_only: true
  tmpfs: [/tmp]
  networks: [kx]
  # the app sends its own logs to SigNoz over OTLP (with trace ids); this label tells the SigNoz collector
  # to skip these containers' log files, so lines are not stored twice (infra/server/signoz/)
  labels: { kx.logs: otlp }
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "3", labels: "kx.logs,com.docker.compose.service,com.docker.compose.project" }

x-logs: &logs
  driver: json-file
  options: { max-size: "50m", max-file: "3", labels: "com.docker.compose.service,com.docker.compose.project" }

services:
  redis:
    image: ${KX_IMG_REDIS:-redis:8.2}
    restart: unless-stopped
    # Celery broker: never evict; AOF so queued jobs survive a restart (Options by field §11)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    networks: [kx]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 20
    logging: *logs

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    environment:
      KX_PROCESS: migrate

  api:
    <<: *app
    command: ["api"]
    environment:
      KX_PROCESS: api
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # routed by the Coolify proxy: https://api.<domain> -> api:8000
    expose: ["8000"]

  worker:
    <<: *app
    command: ["worker"]
    environment:
      KX_PROCESS: worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *app
    command: ["beat"]
    environment:
      KX_PROCESS: beat
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  voice:
    <<: *app
    command: ["voice"]
    environment:
      KX_PROCESS: voice
    depends_on:
      migrate: { condition: service_completed_successfully }

  cms:
    # Payload CMS (website admin, §7); image built from the CMS repo (not in this repo)
    image: ${KX_CMS_IMAGE:-ghcr.io/kairox/cms:latest}
    restart: unless-stopped
    env_file: ["${KX_CMS_ENV_FILE:-env/pack-cms.env}"]
    expose: ["3000"]
    networks: [kx]
    logging: *logs

  # Free hosting version of the website and CRM screens (v2 §2 alternative to Vercel Pro):
  #   docker compose --profile selfhost-web up -d web crm-web
  web:
    profiles: [selfhost-web]
    image: ${KX_WEB_IMAGE:-ghcr.io/kairox/web:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?}
    expose: ["3000"]
    networks: [kx]
    logging: *logs

  crm-web:
    profiles: [selfhost-web]
    image: ${KX_CRM_WEB_IMAGE:-ghcr.io/kairox/crm-web:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?}
    expose: ["3000"]
    networks: [kx]
    logging: *logs

volumes:
  redis-data:

networks:
  kx:
    external: true
