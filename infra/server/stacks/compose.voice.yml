# Live voice (v2 §2): LiveKit server, self-hosted. The `voice` agent worker is in compose.app.yml.
# Signalling (H7): 7880 is not published. Browsers reach wss://voice.<domain> through Cloudflare (proxied DNS,
# WebSockets) -> SafeLine :443 -> Coolify proxy -> livekit:7880 over kx-proxy, like api. / cms., so 443 stays
# open to Cloudflare only and the origin certificate is never shown to a browser.
# Media goes direct to the server IP (--node-ip, not the hostname): 7881/tcp, 3478/udp (TURN), 50000-50100/udp.
name: kx-voice

services:
  livekit:
    image: ${KX_IMG_LIVEKIT:-livekit/livekit-server:v1.13.11}
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:?public IPv4 of the server}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    expose: ["7880"]   # signalling, routed by the Coolify proxy (https://voice.<domain> -> livekit:7880)
    ports:
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    # default: this stack's own network, carries the published media ports; kx-proxy: signalling (H1)
    networks: [default, kx-proxy]
    labels: { traefik.docker.network: kx-proxy }
    # M15: read-only root, no capabilities (tested 18 Nov with v1.13.11: starts, listens on 7880 / 7881 / UDP)
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 2g, cpus: "2" }   # M4
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3", labels: "com.docker.compose.service,com.docker.compose.project" }

networks:
  default:
  kx-proxy:
    external: true
