# SigNoz collector config for the Kairox dedicated server: SigNoz v0.129.0's own deploy/docker file (the last
# release with compose files) plus three receivers marked "kx" below (17 Nov):
#   hostmetrics   CPU, memory, load, disks, filesystems, network of the server (reads the host through /hostfs)
#   docker_stats  CPU / memory / network per container (read-only Docker API proxy, M15)
#   filelog       every container's log file; lines of the app containers are dropped here because the app
#                 sends its own logs over OTLP with their trace id (label kx.logs=otlp, see compose.app.yml)
# Mounted by compose.signoz-overrides.yml. Keep the rest identical to upstream when upgrading SigNoz.
connectors:
  signozmeter:
    metrics_flush_interval: 1h
    dimensions:
      - name: service.name
      - name: deployment.environment
      - name: host.name
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      global:
        scrape_interval: 60s
      scrape_configs:
        - job_name: otel-collector
          static_configs:
          - targets:
              - localhost:8888
            labels:
              job_name: otel-collector
  # kx: the server itself
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem:
        exclude_mount_points:
          match_type: regexp
          mount_points: ["/hostfs/(proc|sys|dev|run|var/lib/docker/.+)(/.*)?$"]
      network: {}
      paging: {}
  # kx: every container (api, worker, postgres, stalwart, livekit, speech, ...)
  docker_stats:
    # M15: the read-only Docker API proxy of compose.signoz-overrides.yml, not the socket itself
    endpoint: tcp://signoz-docker-proxy:2375
    api_version: "1.44"  # Docker 29 refuses older API versions
    # one-shot stats take ~1-2 s per container (Docker samples twice for CPU); 20 s timed out on a laptop
    collection_interval: 60s
    timeout: 50s
  # kx: container log files (json-file driver); app containers are dropped (they log over OTLP)
  filelog/containers:
    include: ["/var/lib/docker/containers/*/*-json.log"]
    start_at: end
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      - type: filter
        expr: 'attributes.attrs != nil and attributes.attrs["kx.logs"] == "otlp"'
      # the compose service / project names (logging option `labels`, set in every stack) name the source
      - type: move
        if: 'attributes.attrs != nil and attributes.attrs["com.docker.compose.service"] != nil'
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["service.name"]
      - type: move
        if: 'attributes.attrs != nil and attributes.attrs["com.docker.compose.project"] != nil'
        from: attributes.attrs["com.docker.compose.project"]
        to: resource["service.namespace"]
      - type: remove
        if: 'attributes.attrs != nil'
        field: attributes.attrs
      - type: remove
        field: attributes.time
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]{64})/'
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: move
        from: attributes.log
        to: body
processors:
  batch:
    send_batch_size: 10000
    send_batch_max_size: 11000
    timeout: 10s
  batch/meter:
    send_batch_max_size: 25000
    send_batch_size: 20000
    timeout: 1s
  resourcedetection:
    # Using OTEL_RESOURCE_ATTRIBUTES envvar, env detector adds custom labels.
    detectors: [env, system]
    timeout: 2s
  signozspanmetrics/delta:
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
    latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s ]
    dimensions_cache_size: 100000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: true
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
      # This is added to ensure the uniqueness of the timeseries
      # Otherwise, identical timeseries produced by multiple replicas of
      # collectors result in incorrect APM metrics
      - name: signoz.collector.id
      - name: service.version
      - name: browser.platform
      - name: browser.mobile
      - name: k8s.cluster.name
      - name: k8s.node.name
      - name: k8s.namespace.name
      - name: host.name
      - name: host.type
      - name: container.name
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
exporters:
  clickhousetraces:
    datasource: tcp://clickhouse:9000/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    use_new_schema: true
  signozclickhousemetrics:
    dsn: tcp://clickhouse:9000/signoz_metrics
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    timeout: 10s
    use_new_schema: true
  signozclickhousemeter:
    dsn: tcp://clickhouse:9000/signoz_meter
    timeout: 45s
    sending_queue:
      enabled: false
  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://clickhouse:9000/signoz_metadata
    enabled: true
    timeout: 45s
service:
  telemetry:
    logs:
      encoding: json
  extensions:
    - health_check
    - pprof
  pipelines:
    traces:
      receivers: [otlp]
      processors: [signozspanmetrics/delta, batch]
      exporters: [clickhousetraces, metadataexporter, signozmeter]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    metrics/prometheus:
      receivers: [prometheus]
      processors: [batch]
      exporters: [signozclickhousemetrics, metadataexporter, signozmeter]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouselogsexporter, metadataexporter, signozmeter]
    metrics/meter:
      receivers: [signozmeter]
      processors: [batch/meter]
      exporters: [signozclickhousemeter]
    # kx: server and container metrics, container logs
    metrics/host:
      receivers: [hostmetrics, docker_stats]
      processors: [resourcedetection, batch]
      exporters: [signozclickhousemetrics, metadataexporter]
    logs/containers:
      receivers: [filelog/containers]
      processors: [resourcedetection, batch]
      exporters: [clickhouselogsexporter, metadataexporter]
